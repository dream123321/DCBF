schema_version: 1
model:
  kind: static-radial
  species_count: 1
  l_max: 3
  radial_channels: 4
  neighbor_cutoff: 6.5
  radial:
    basis: chebyshev-sss
    basis_size: 10
    warp_sharing: K
  interaction:
    channels: 2
    body_order: 4
    channel_coupling: cross
initialization:
  parameters: random
  seed: 1
training:
  engine: native
  device: cpu
  dtype: float64
  profile: native-static-v1
  optimizer: bfgs
  iterations: 1000
  convergence_tolerance: 1e-5
loss:
  energy_weight: 1
  force_weight: 0.01
  virial_weight: 0.001
